<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>BIZA SaaS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Tahoma,Arial,sans-serif;
  background:#020306;
  color:#f5f7fb;
}

body{
  overflow-x:hidden;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   VARIABLES
========================= */

:root{
  --bg:#020306;
  --panel:#070b13;
  --panel2:#0a101a;
  --blue:#00aaff;
  --green:#00ff9d;
  --purple:#9d4edd;
  --red:#ff3158;
  --text:#f5f7fb;
  --muted:#7f8ba0;
  --border:rgba(0,170,255,.22);
}

/* =========================
   BACKGROUND
========================= */

#network{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
  background:#020306;
}

.star{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#00aaff;
  box-shadow:
    0 0 7px #00aaff,
    0 0 18px #00aaff;
  animation:starPulse 2.5s infinite alternate;
}

.link{
  position:absolute;
  height:1px;
  transform-origin:left center;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(0,170,255,.65),
    transparent
  );
  box-shadow:0 0 7px rgba(0,170,255,.45);
  opacity:.4;
}

@keyframes starPulse{
  from{
    opacity:.25;
    transform:scale(.7);
  }
  to{
    opacity:1;
    transform:scale(1.5);
  }
}

/* =========================
   APP
========================= */

.app{
  position:relative;
  z-index:2;
  min-height:100vh;
}

/* =========================
   GLASS
========================= */

.glass{
  background:
    linear-gradient(
      145deg,
      rgba(9,13,23,.96),
      rgba(3,6,12,.94)
    );

  border:1px solid var(--border);

  box-shadow:
    0 0 30px rgba(0,140,255,.08),
    inset 0 0 30px rgba(0,120,255,.025);

  backdrop-filter:blur(16px);
}

/* =========================
   LOGIN
========================= */

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:min(420px,100%);
  padding:30px;
  border-radius:28px;
}

.logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  letter-spacing:6px;

  color:#fff;

  text-shadow:
    0 0 8px var(--blue),
    0 0 25px var(--blue),
    0 0 45px rgba(0,170,255,.7);

  margin-bottom:8px;
}

.logo-sub{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-bottom:30px;
}

.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  color:#9ba6b9;
  font-size:13px;
  margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid rgba(0,170,255,.2);
  outline:none;
  border-radius:13px;
  background:#050811;
  color:#fff;
  padding:13px 14px;
  transition:.2s;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--blue);
  box-shadow:0 0 16px rgba(0,170,255,.16);
}

.primary-btn{
  width:100%;
  border:1px solid rgba(0,180,255,.65);

  background:
    linear-gradient(
      135deg,
      rgba(0,170,255,.18),
      rgba(0,255,157,.07)
    );

  color:#fff;

  border-radius:13px;
  padding:13px 18px;

  box-shadow:
    0 0 14px rgba(0,170,255,.13);

  transition:.2s;
}

.primary-btn:hover{
  border-color:var(--blue);
  box-shadow:
    0 0 25px rgba(0,170,255,.25);
}

.primary-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.login-error{
  min-height:22px;
  margin-top:12px;
  color:#ff5574;
  text-align:center;
  font-size:13px;
}

/* =========================
   TOPBAR
========================= */

.topbar{
  min-height:72px;

  padding:12px 18px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:15px;

  position:sticky;
  top:0;
  z-index:20;

  background:rgba(2,3,6,.84);

  border-bottom:
    1px solid rgba(0,170,255,.13);

  backdrop-filter:blur(18px);
}

.brand-small{
  font-weight:900;
  letter-spacing:3px;

  color:#fff;

  text-shadow:
    0 0 14px var(--blue);
}

.user-info{
  color:#8d98aa;
  font-size:12px;
  margin-top:4px;
}

.logout-btn{
  border:1px solid rgba(255,49,88,.5);
  background:rgba(255,49,88,.07);
  color:#ff6380;
  border-radius:12px;
  padding:9px 14px;
}

/* =========================
   MAIN
========================= */

.main{
  width:min(1000px,100%);
  margin:auto;

  padding:22px;

  padding-bottom:100px;
}

.page-title{
  font-size:23px;
  font-weight:900;
  margin:5px 0 20px;
}

.page-title span{
  color:var(--blue);

  text-shadow:
    0 0 12px rgba(0,170,255,.6);
}

/* =========================
   DASHBOARD
========================= */

.cards{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);

  gap:13px;
}

.stat-card{
  padding:18px;
  border-radius:20px;
}

.stat-title{
  color:#7f8ba0;
  font-size:12px;
  margin-bottom:9px;
}

.stat-value{
  font-size:24px;
  font-weight:900;
}

.blue{
  color:var(--blue);
}

.green{
  color:var(--green);
}

.purple{
  color:#bd76ff;
}

.red{
  color:#ff5574;
}

/* =========================
   ACTIONS
========================= */

.dashboard-actions{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:13px;

  margin-top:18px;
}

.action-card{
  height:100px;

  border-radius:22px;

  border:1px solid rgba(0,170,255,.25);

  background:
    linear-gradient(
      145deg,
      rgba(8,14,24,.94),
      rgba(3,6,12,.94)
    );

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;
  overflow:hidden;

  transition:.2s;
}

.action-card:hover{
  transform:translateY(-2px);

  border-color:
    rgba(0,170,255,.65);

  box-shadow:
    0 0 24px rgba(0,170,255,.18);
}

.action-card span{
  position:relative;
  z-index:2;
}

/* =========================
   SECTION
========================= */

.section{
  margin-top:18px;
  padding:18px;
  border-radius:22px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin-bottom:18px;
}

.section-title{
  font-weight:900;
}

.neon-btn{
  border:1px solid rgba(0,180,255,.55);

  background:
    rgba(0,170,255,.07);

  color:#fff;

  border-radius:11px;

  padding:9px 13px;
}

.empty{
  text-align:center;
  padding:30px;
  color:#69758a;
}

/* =========================
   PRODUCT FORM
========================= */

.product-box{
  max-width:720px;
  margin:0 auto;
}

.product-intro{
  padding:15px;

  margin-bottom:20px;

  border-radius:15px;

  background:
    rgba(0,170,255,.035);

  border:
    1px solid rgba(0,170,255,.1);

  color:#8490a5;

  font-size:13px;

  line-height:1.9;
}

.product-form{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:14px;
}

.full{
  grid-column:1/-1;
}

.form-actions{
  grid-column:1/-1;

  display:flex;

  gap:10px;

  margin-top:4px;
}

.form-actions button{
  flex:1;
}

.result-box{
  display:none;

  margin-top:18px;

  padding:15px;

  border-radius:14px;

  font-size:13px;

  line-height:2;
}

.result-box.success{
  display:block;

  color:#00ffae;

  background:
    rgba(0,255,157,.05);

  border:
    1px solid rgba(0,255,157,.2);
}

.result-box.error{
  display:block;

  color:#ff607e;

  background:
    rgba(255,49,88,.05);

  border:
    1px solid rgba(255,49,88,.2);
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;

  bottom:12px;
  left:50%;

  transform:
    translateX(-50%);

  width:min(
    560px,
    calc(100% - 22px)
  );

  height:65px;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  border-radius:23px;

  z-index:50;

  padding:6px;
}

.nav-btn{
  border:0;
  background:transparent;

  color:#687386;

  border-radius:18px;

  position:relative;
}

.nav-btn.active{
  color:#fff;
}

.nav-ball{
  position:absolute;

  width:42px;
  height:42px;

  border-radius:50%;

  top:-25px;
  left:50%;

  transform:
    translateX(-50%);

  background:#050912;

  border:
    1px solid var(--blue);

  box-shadow:
    0 0 15px rgba(0,170,255,.55),
    inset 0 0 12px rgba(0,170,255,.15);

  opacity:0;
}

.nav-btn.active .nav-ball{
  opacity:1;
}

.nav-label{
  position:relative;
  z-index:2;

  font-size:12px;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;

  z-index:100;

  background:
    rgba(0,0,0,.76);

  display:none;

  align-items:center;
  justify-content:center;

  padding:18px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(580px,100%);

  max-height:90vh;

  overflow:auto;

  border-radius:24px;

  padding:22px;
}

.modal-head{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-bottom:18px;
}

.modal-title{
  font-size:18px;
  font-weight:900;
}

.close-btn{
  border:0;
  background:transparent;

  color:#8994a8;

  font-size:25px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;

  bottom:90px;
  left:50%;

  transform:
    translateX(-50%)
    translateY(20px);

  z-index:200;

  padding:12px 18px;

  border-radius:13px;

  background:#07101a;

  border:
    1px solid rgba(0,170,255,.35);

  box-shadow:
    0 0 25px rgba(0,170,255,.18);

  opacity:0;

  pointer-events:none;

  transition:.25s;

  font-size:13px;
}

.toast.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:750px){

  .cards{
    grid-template-columns:
      1fr 1fr;
  }

  .dashboard-actions{
    grid-template-columns:
      1fr 1fr;
  }

}

@media(max-width:520px){

  .topbar{
    padding:
      11px 13px;
  }

  .main{
    padding:
      16px;

    padding-bottom:100px;
  }

  .logo{
    font-size:34px;
  }

  .login-card{
    padding:23px;
  }

  .stat-card{
    padding:14px;
  }

  .stat-value{
    font-size:20px;
  }

  .dashboard-actions{
    gap:9px;
  }

  .action-card{
    height:88px;
  }

  .product-form{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .form-actions{
    grid-column:auto;

    flex-direction:column;
  }

}
</style>
</head>

<body>

<div id="network"></div>

<div id="app" class="app">

<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginPage" class="login-page">

    </div>

    <div class="logo-sub">

    </div>

    <form id="loginForm">

      <div class="field">

</section>


<!-- =====================================================

===================================================== -->

<section id="storePage" class="hidden">

  <header class="topbar">

      </div>

    <!-- ACTIONS -->

      <button

===================================================== -->

<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
  "https://rellsmuqjhcfhenjkbxa.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_PRT5-T0k-_AiSvy6lrJV-g_r7wLQjRk";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   STATE
===================================================== */

const state = {

  session:null,

  user:null,

  profile:null,

  store:null

};


/* =====================================================
   SHORTCUT
===================================================== */

const $ = id =>
  document.getElementById(id);


/* =====================================================
   TOAST
===================================================== */

function toast(message){

  const el=$("toast");

  el.textContent=message;

  el.classList.add("show");

  clearTimeout(
    window.__toastTimer
  );

  window.__toastTimer=
    setTimeout(()=>{

      el.classList.remove("show");

    },2600);
}


/* =====================================================
   NETWORK
===================================================== */

function createNetwork(){

  const network=$("network");

  const points=[];

  for(let i=0;i<38;i++){

    const star=
      document.createElement("div");

    star.className="star";

    const x=Math.random()*100;
    const y=Math.random()*100;

    star.style.left=
      x+"%";

    star.style.top=
      y+"%";

    star.style.animationDelay=
      Math.random()*3+"s";

    network.appendChild(star);

    points.push({

      x:
        window.innerWidth*x/100,

      y:
        window.innerHeight*y/100

    });

  }


  for(
    let i=0;
    i<points.length;
    i++
  ){

    for(
      let j=i+1;
      j<points.length;
      j++
    ){

      const a=points[i];
      const b=points[j];

      const dx=b.x-a.x;
      const dy=b.y-a.y;

      const distance=
        Math.sqrt(
          dx*dx+dy*dy
        );

      if(distance>220)
        continue;


      const link=
        document.createElement("div");

      link.className="link";

      link.style.left=
        a.x+"px";

      link.style.top=
        a.y+"px";

      link.style.width=
        distance+"px";

      link.style.transform=
        `rotate(${Math.atan2(dy,dx)}rad)`;

      network.appendChild(link);

    }

  }

}


/* =====================================================
   LOGIN
===================================================== */

$("loginForm")
.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();


    const username=
      $("loginUsername")
      .value
      .trim()
      .toLowerCase();


    const password=
      $("loginPassword")
      .value;


    $("loginError")
      .textContent=
      "در حال ورود...";


    $("loginBtn")
      .disabled=true;


    try{

      const response=
        await fetch(
          SUPABASE_URL+
          "/functions/v1/biza-login",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_PUBLISHABLE_KEY
            },

            body:
              JSON.stringify({
                username,
                password
              })
          }
        );


      const data=
        await response.json();


      if(
        !response.ok ||
        !data.ok
      ){

        throw new Error(
          data.error ||
          "ورود ناموفق بود"
        );

      }


      /*
       * بسیار مهم:
       * نشست برگشتی از biza-login
       * داخل Supabase JS ثبت می‌شود.
       */

      const {
        data:setSessionData,
        error:setSessionError
      }=
        await supabaseClient.auth.setSession({

          access_token:
            data.session.access_token,

          refresh_token:
            data.session.refresh_token

        });


      if(
        setSessionError ||
        !setSessionData?.session
      ){

        throw new Error(
          setSessionError?.message ||
          "برقراری نشست ناموفق بود"
        );

      }


      state.session=
        setSessionData.session;


      state.user=
        data.user;


      state.profile=
        data.user;


      state.store=
        data.store || null;


      localStorage.setItem(
        "biza_session",
        JSON.stringify(
          state.session
        )
      );


      localStorage.setItem(
        "biza_profile",
        JSON.stringify(
          state.profile
        )
      );


      $("loginError")
        .textContent="";


      if(
        data.user.role!=="store_user"
      ){

        throw new Error(
          "برای این تست باید با کاربر فروشگاه وارد شوید."
        );

      }


      openStore();


    }catch(error){

      console.error(
        "Login error:",
        error
      );


      $("loginError")
        .textContent=
        error.message ||
        "خطا در ورود";


    }finally{

      $("loginBtn")
        .disabled=false;

    }

  }
);


/* =====================================================
   RESTORE SESSION
===================================================== */

async function restoreSession(){

  const saved=
    localStorage.getItem(
      "biza_session"
    );


  if(!saved)
    return;


  try{

    const session=
      JSON.parse(saved);


    if(
      !session?.access_token ||
      !session?.refresh_token
    ){

      return;

    }


    const {
      data:setSessionData,
      error:setSessionError
    }=
      await supabaseClient.auth.setSession({

        access_token:
          session.access_token,

        refresh_token:
          session.refresh_token

      });


    if(
      setSessionError ||
      !setSessionData?.session
    ){

      localStorage.removeItem(
        "biza_session"
      );

      localStorage.removeItem(
        "biza_profile"
      );

      return;

    }


    state.session=
      setSessionData.session;


    const {
      data,
      error
    }=
      await supabaseClient.auth.getUser(
        setSessionData
          .session
          .access_token
      );


    if(
      error ||
      !data?.user
    ){

      localStorage.removeItem(
        "biza_session"
      );

      localStorage.removeItem(
        "biza_profile"
      );

      return;

    }


    state.user=
      data.user;


    /*
     * پروفایل را فقط برای احراز هویت
     * دریافت می‌کنیم.
     */

    const {
      data:profile,
      error:profileError
    }=
      await supabaseClient
        .from("profiles")
        .select(
          "id,username,full_name,role,store_id,is_active"
        )
        .eq(
          "id",
          data.user.id
        )
        .maybeSingle();


    if(
      profileError ||
      !profile
    ){

      console.error(
        "Profile error:",
        profileError
      );

      return;

    }


    state.profile=
      profile;


    localStorage.setItem(
      "biza_profile",
      JSON.stringify(profile)
    );


    if(
      profile.role!=="store_user"
    ){

      await logout();

      return;

    }


    /*
     * برای این مرحله فروشگاه را از
     * پاسخ قبلی یا دیتابیس می‌گیریم.
     */

    if(
      profile.store_id
    ){

      const {
        data:store,
        error:storeError
      }=
        await supabaseClient
          .from("stores")
          .select(
            "id,name,code,status"
          )
          .eq(
            "id",
            profile.store_id
          )
          .maybeSingle();


      if(
        !storeError &&
        store
      ){

        state.store=
          store;

      }

    }


    openStore();


  }catch(error){

    console.error(
      "Session restore:",
      error
    );

  }

}


/* =====================================================
   OPEN STORE
===================================================== */

function openStore(){

  $("loginPage")
    .classList
    .add("hidden");


  $("storePage")
    .classList
    .remove("hidden");


  $("storeNameTitle")
    .textContent=
      state.store?.name ||
      "فروشگاه";


  $("storeUserInfo")
    .textContent=
      state.profile?.full_name ||
      state.profile?.username ||
      "کاربر";


  /*
   * فعلاً هیچ SELECT از products
   * هنگام ورود انجام نمی‌شود.
   *
   * هدف:
   * فقط ثبت کالا را تست کنیم.
   */

}


/* =====================================================
   PRODUCT PAGE
===================================================== */

function openProductPage(){

  $("productSection")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });


  setTimeout(()=>{

    $("productBarcode")
      .focus();

  },450);

}


/* =====================================================
   PRODUCT FORM
===================================================== */

$("productForm")
.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();


    const barcode=
      $("productBarcode")
      .value
      .trim();


    const name=
      $("productName")
      .value
      .trim();


    const description=
      $("productDescription")
      .value
      .trim();


    const unit=
      $("productUnit")
      .value
      .trim() ||
      "عدد";


    const result=
      $("productResult");


    const button=
      $("saveProductBtn");


    if(!barcode){

      showProductError(
        "بارکد کالا را وارد کنید."
      );

      return;

    }


    if(!name){

      showProductError(
        "نام کالا را وارد کنید."
      );

      return;

    }


    button.disabled=true;

    button.textContent=
      "در حال ثبت...";


    result.className=
      "result-box";

    result.textContent="";


    try{

      /*
       * ثبت کالا فقط از طریق RPC امن.
       */

      const {
        data,
        error
      }=
        await supabaseClient.rpc(
          "create_product",
          {
            p_barcode:
              barcode,

            p_name:
              name,

            p_description:
              description ||
              null,

            p_unit:
              unit
          }
        );


      if(error){

        console.error(
          "create_product error:",
          error
        );

        throw error;

      }


      /*
       * اینجا یعنی RPC موفق بوده
       * و کالا در دیتابیس ثبت شده.
       */

      result.className=
        "result-box success";


      result.innerHTML=
        `
        کالا با موفقیت ثبت شد.<br>
        <b>نام کالا:</b>
        ${escapeHtml(name)}<br>
        <b>بارکد:</b>
        ${escapeHtml(barcode)}<br>
        <b>شناسه کالا:</b>
        ${escapeHtml(data || "-")}
        `;


      toast(
        "کالا با موفقیت ثبت شد"
      );


      /*
       * فرم را پاک نمی‌کنیم تا کاربر
       * نتیجه ثبت را ببیند.
       */


    }catch(error){

      showProductError(
        error.message ||
        "ثبت کالا ناموفق بود."
      );

    }finally{

      button.disabled=false;

      button.textContent=
        "ثبت کالا";

    }

  }
);


/* =====================================================
   PRODUCT ERROR
===================================================== */

function showProductError(message){

  const result=
    $("productResult");


  result.className=
    "result-box error";


  result.textContent=
    message;

}


/* =====================================================
   CLEAR PRODUCT
===================================================== */

function clearProductForm(){

  $("productForm")
    .reset();


  $("productUnit")
    .value="عدد";


  $("productResult")
    .className=
      "result-box";


  $("productResult")
    .textContent="";


  $("productBarcode")
    .focus();

}


/* =====================================================
   HOME
===================================================== */

function goHome(){

  document
    .querySelectorAll(
      ".nav-btn"
    )
    .forEach(
      x=>x.classList.remove(
        "active"
      )
    );


  $("navHome")
    .classList
    .add("active");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   NOT READY
===================================================== */

function notReady(){

  toast(
    "این بخش بعد از تأیید ثبت کالا فعال می‌شود."
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  try{

    await supabaseClient
      .auth
      .signOut();

  }catch(error){

    console.error(
      error
    );

  }


  state.session=null;
  state.user=null;
  state.profile=null;
  state.store=null;


  localStorage.removeItem(
    "biza_session"
  );

  localStorage.removeItem(
    "biza_profile"
  );


  $("storePage")
    .classList
    .add("hidden");


  $("loginPage")
    .classList
    .remove("hidden");


  $("loginUsername")
    .value="";


  $("loginPassword")
    .value="";


  $("loginError")
    .textContent="";

}


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth
.onAuthStateChange(
  function(event,session){

    if(
      event==="TOKEN_REFRESHED" &&
      session
    ){

      state.session=
        session;


      localStorage.setItem(
        "biza_session",
        JSON.stringify(session)
      );

    }


    if(
      event==="SIGNED_OUT"
    ){

      state.session=null;

    }

  }
);


/* =====================================================
   START
===================================================== */

createNetwork();

restoreSession();

</script>
